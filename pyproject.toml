[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "plotdigitizer"
version = "0.1.0"
description = "Extract calibrated data from XY plots in scientific PDFs (vector path first, LLM-free core)."
requires-python = ">=3.9"
dependencies = [
  "pymupdf>=1.24",
  "numpy",
  "matplotlib",
  "jsonschema",
]

[project.optional-dependencies]
raster = ["opencv-python-headless"]
test = ["pytest"]

[project.scripts]
plotdigitizer = "plotdigitizer.cli:main"

[tool.setuptools]
packages = ["plotdigitizer"]

[tool.setuptools.package-data]
plotdigitizer = ["prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
