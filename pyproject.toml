[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "plotdigitizer"
version = "0.1.0"
description = "Extract calibrated data from XY plots in scientific PDFs (vector path first, LLM-free core)."
requires-python = ">=3.9"
dependencies = [
  "pymupdf>=1.24",
  "numpy",
  "matplotlib",
  "jsonschema",
]

[project.optional-dependencies]
raster = ["opencv-python-headless"]
web = ["fastapi>=0.110", "uvicorn>=0.29", "python-multipart>=0.0.9"]
test = ["pytest", "httpx"]

[project.scripts]
plotdigitizer = "plotdigitizer.cli:main"

[tool.setuptools]
packages = ["plotdigitizer", "plotdigitizer.web"]

[tool.setuptools.package-data]
plotdigitizer = ["prompts/*.md"]
"plotdigitizer.web" = ["static/*", "static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
